name: Render Contribution Waveform

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/waveform.mjs"
      - ".github/workflows/waveform.yml"

permissions:
  contents: write

concurrency:
  group: waveform
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render waveform
        run: node scripts/waveform.mjs "${{ github.repository_owner }}" assets/waveform.svg

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/waveform.svg; then
            echo "waveform unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/waveform.svg
          git commit -m "chore: re-render contribution waveform"
          git push
